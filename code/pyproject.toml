[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-advisor-bot"
version = "0.1.0"
description = "LLM-augmented multi-signal stock advisor (CM3070 thesis). Research/demo only — no live trading, no real money."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Aly Thabet", email = "alythabet9@gmail.com" }]
keywords = [
    "finance",
    "stocks",
    "llm",
    "technical-analysis",
    "calibration",
    "counterfactual",
    "backtesting",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.2,<3.1",
    "numpy>=1.26,<2.5",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.3,<2.0",
    "yfinance>=0.2.40,<2.0",
    "pyarrow>=14.0",
    "requests>=2.31,<3.0",
    "streamlit>=1.30,<2.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10.0", "ruff>=0.4,<1.0"]

[tool.setuptools.packages.find]
include = ["advisor*"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade,
# B bugbear, D pydocstyle (Google convention).
select = ["E", "W", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]  # incompatible blank-line-before-docstring rules

[tool.ruff.lint.pydocstyle]
convention = "google"
